<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodmate AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff7ed,#fef3c7,#ecfdf5);display:flex;align-items:center;justify-content:center;padding:20px;color:#292524}
.app{width:min(960px,100%);height:min(760px,94vh);min-height:560px;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,255,255,.94);border:1px solid rgba(120,113,108,.15);border-radius:24px;box-shadow:0 24px 70px rgba(120,53,15,.16)}
.header{display:flex;align-items:center;gap:14px;padding:20px 24px;background:linear-gradient(135deg,#f97316,#ea580c);color:white}
.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.18);font-size:25px}
.header h1{font-size:22px;margin-bottom:3px}.header p{font-size:13px;opacity:.9}
.chat{flex:1;overflow-y:auto;padding:24px;background:#fffbf5;scroll-behavior:smooth}
.message-row{display:flex;margin-bottom:16px}.message-row.user{justify-content:flex-end}
.message{max-width:78%;padding:13px 16px;border-radius:18px;line-height:1.55;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bot .message{background:#fff;border:1px solid #fed7aa;border-bottom-left-radius:5px}
.user .message{background:#f97316;color:#fff;border-bottom-right-radius:5px}
.typing{display:none;width:fit-content;padding:12px 15px;background:#fff;border:1px solid #fed7aa;border-radius:18px;border-bottom-left-radius:5px}
.typing span{display:inline-block;width:7px;height:7px;margin:0 3px;border-radius:50%;background:#fb923c;animation:bounce 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.input-area{display:flex;gap:10px;padding:16px;background:#fff;border-top:1px solid #eee7df}
textarea{flex:1;min-height:48px;max-height:120px;resize:none;padding:13px 15px;border:1px solid #d6d3d1;border-radius:14px;outline:none;font:inherit;line-height:1.4}
textarea:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.12)}
button{align-self:stretch;min-width:88px;border:none;border-radius:14px;background:#f97316;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
@media(max-width:650px){body{padding:0}.app{height:100vh;min-height:100vh;border-radius:0}.header{padding:16px}.chat{padding:16px}.message{max-width:88%}.input-area{padding:12px}button{min-width:72px}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="logo">🍴</div><div><h1>Foodmate AI</h1><p>Your friendly food & cooking companion</p></div></header>
<section class="chat" id="chat">
<div class="message-row bot"><div class="message">Hi! I’m Foodmate AI 🍴
Ask me about recipes, cooking techniques, ingredients, meal ideas, food storage, or general nutrition.</div></div>
</section>
<div class="typing" id="typing"><span></span><span></span><span></span></div>
<form class="input-area" id="chatForm">
<textarea id="messageInput" placeholder="Ask Foodmate AI something..." rows="1" required></textarea>
<button id="sendButton" type="submit">Send</button>
</form>
</main>
<script>
const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("messageInput"),button=document.getElementById("sendButton"),typing=document.getElementById("typing");
function addMessage(text,sender){const row=document.createElement("div");row.className=`message-row ${sender}`;const msg=document.createElement("div");msg.className="message";msg.textContent=text;row.appendChild(msg);chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
function setTyping(show){typing.style.display=show?"block":"none";if(show){chat.appendChild(typing);chat.scrollTop=chat.scrollHeight}}
form.addEventListener("submit",async e=>{e.preventDefault();const message=input.value.trim();if(!message||button.disabled)return;addMessage(message,"user");input.value="";input.style.height="48px";button.disabled=true;setTyping(true);
try{const response=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Request failed");addMessage(data.reply,"bot")}catch(error){addMessage("Sorry, I couldn't process that right now. Please try again.","bot")}finally{setTyping(false);button.disabled=false;input.focus()}});
input.addEventListener("input",()=>{input.style.height="48px";input.style.height=Math.min(input.scrollHeight,120)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script>
</body>
</html>
